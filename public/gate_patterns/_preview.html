<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<title>Podgląd wzorów bram</title>
<style>
  body { margin:0; background:#f8fafc; font-family:system-ui, sans-serif; padding:20px; }
  .row { display:flex; gap:16px; flex-wrap:wrap; }
  .tile { display:flex; align-items:center; gap:10px; border:1px solid #cbd5e1; border-radius:8px; background:#fff; padding:11px 12px; width:300px; }
  .tile img { width:116px; height:76px; border-radius:7px; border:1px solid #e2e8f0; display:block; }
  .tile strong { display:block; font-size:14px; color:#0f172a; }
  .tile small { color:#64748b; font-size:12px; }
</style>
</head>
<body>
  <div class="row">
    <div class="tile"><img src="/gate_patterns/smooth.svg"><span><strong>Bez przetłoczeń</strong><small>Gładkie, płaskie panele</small></span></div>
    <div class="tile"><img src="/gate_patterns/high.svg"><span><strong>Przetłoczenia wysokie</strong><small>Poziome linie w większym rozstawie</small></span></div>
    <div class="tile"><img src="/gate_patterns/low.svg"><span><strong>Przetłoczenia niskie</strong><small>Gęste, drobne poziome linie</small></span></div>
    <div class="tile"><img src="/gate_patterns/cassette.svg"><span><strong>Przetłoczenia kasetonowe</strong><small>Siatka ozdobnych kasetonów</small></span></div>
  </div>
</body>
</html>
